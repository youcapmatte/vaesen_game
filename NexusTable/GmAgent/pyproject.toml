[project]
name = "nexus-gm-agent"
version = "0.1.0"
description = "The Nexus Table Gamemaster: a LiveKit voice agent (Deepgram -> Claude -> ElevenLabs) that runs Vaesen mysteries."
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[anthropic,deepgram,elevenlabs]~=1.8",
    "anthropic>=1.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
